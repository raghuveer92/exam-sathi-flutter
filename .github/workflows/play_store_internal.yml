name: Play Store Testing Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & upload AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            printf '%s\n' 'storeFile=keystore.jks'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Compute release version
        run: |
          VERSION_NAME=$(sed -nE 's/^version:[[:space:]]*([^+]+).*/\1/p' pubspec.yaml)
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 13))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME+$VERSION_CODE"

      - name: Build release app bundle
        run: flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-saathi-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Play Console testing tracks
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myexamsaathi
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
